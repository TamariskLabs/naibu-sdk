[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "naibu-sdk"
dynamic = ["version"]
description = "Official Python SDK for the Naibu ERP system."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Tamarisk Labs" }]
keywords = ["naibu", "erp", "sdk", "api", "client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.24,<1",
    "typing-extensions>=4.5; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "respx>=0.20",
    "ruff>=0.5",
    "mypy>=1.8",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
]

[project.urls]
Homepage = "https://github.com/TamariskLabs/naibu-sdk"
Documentation = "https://github.com/TamariskLabs/naibu-sdk#readme"
Repository = "https://github.com/TamariskLabs/naibu-sdk"
Issues = "https://github.com/TamariskLabs/naibu-sdk/issues"
Changelog = "https://github.com/TamariskLabs/naibu-sdk/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/naibu/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/naibu"]

[tool.hatch.build.targets.sdist]
include = ["src/naibu", "README.md", "LICENSE", "CHANGELOG.md"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["naibu"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
files = ["src/naibu"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --strict-markers --cov=naibu --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that require a live Naibu API (deselect with -m 'not integration')",
]

[tool.coverage.run]
branch = true
source = ["naibu"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
